services:
  server:
    image: softvence/calvinlockhart-server:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: calvinlockhart_api
    restart: always
    env_file:
      - .env
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npm run start:prod"

  db:
    image: postgres:16-alpine
    container_name: calvinlockhart_db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-calvinlockhart_db}
    volumes:
      - calvinlockhart_db:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-calvinlockhart_db}"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  calvinlockhart_db:
